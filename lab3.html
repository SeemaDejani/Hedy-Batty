<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FFF5F8">
  <title>Lab 3 | Hedy &amp; Batty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <script src="utils.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
  <script>
    const isObj = x => x !== null && typeof x === 'object';

    // Follows the vulnerable merge() on paper. It never touches the real Object.prototype.
    // Returns what would be written onto the shared prototype, or null if nothing reaches it.
    const pollution = obj => {
      for (const key of Object.keys(obj)) {
        const value = obj[key];
        if (!isObj(value)) continue;

        if (key === '__proto__') {
          return { via: '__proto__', written: value };
        }
        if (key === 'constructor' && isObj(value.prototype)) {
          return { via: 'constructor.prototype', written: value.prototype };
        }

        const deeper = pollution(value);
        if (deeper) return deeper;
      }
      return null;
    };

    runLab({
      n: 3,
      title: 'Prototype Pollution',
      tag: 'OWASP A08 · CWE-1321',

      intro: [
        ['b', 'Your merge copies every key I send. Even the sneaky ones.', 'evil'],
        ['h', 'That is prototype pollution: a key like __proto__ lets the input write into the shared object that all objects inherit from. OWASP A08, CWE-1321.', 'scared'],
        ['b', 'Watch me give every new cat an admin crown.', 'evil'],
        ['h', 'Show me the code.', 'smug']
      ],

      after: [
        ['h', 'Even cats that sent nothing got the crown!', 'scared'],
        ['b', 'Because __proto__ pointed at the shared prototype, so every plain object now inherits isAdmin. Libraries like lodash had this bug (CVE-2019-10744).', 'evil'],
        ['h', 'Then we copy only the keys we expect, and only as text.', 'smug']
      ],

      moves: [
        ['Normal profile', '{"nickname":"Mimi"}'],
        ['__proto__', '{"__proto__":{"isAdmin":true}}'],
        ['constructor', '{"constructor":{"prototype":{"isAdmin":true}}}']
      ],

      sim: (v, f) => {
        let data;
        try {
          data = JSON.parse(v);
        } catch (e) {
          return { k: 'n', msg: 'Not valid JSON.' };
        }

        if (!isObj(data) || Array.isArray(data)) {
          return { k: 'n', msg: 'Send a JSON object, like {"nickname":"Mimi"}.' };
        }

        if (f) {
          const ok = Object.keys(data).every(key =>
            ['nickname', 'theme'].includes(key) && typeof data[key] === 'string'
          );
          return ok
            ? { k: 'n', msg: 'Saved for this cat only.' }
            : { k: 'x', msg: 'Unexpected keys and objects are skipped. The shared prototype stays clean.' };
        }

        const hit = pollution(data);
        const keys = hit ? Object.keys(hit.written) : [];

        if (keys.length) {
          return {
            k: 'b',
            rows: [
              'path used: ' + hit.via,
              'written onto the shared prototype: ' + keys.map(k => k + ' = ' + JSON.stringify(hit.written[k])).join(', '),
              'a brand-new {} now inherits these keys (simulated)'
            ]
          };
        }

        return { k: 'n', msg: 'Profile saved.' };
      },

      sc: r => {
        const m = look(r);
        const hit = r.k === 'b';
        const msg = hit ? 'Crown for everyone!'
                  : r.k === 'x' ? 'Bad keys skipped'
                  : r.k === 'n' ? 'Profile saved'
                  : 'Send a profile';

        const cats = [70, 170, 270].map(x => `
          ${cat(x, 130, .8, m.cat, hit)}
          <rect x="${x - 20}" y="139" width="40" height="14" rx="7" fill="${hit ? C.H : C.T}"/>
          <text x="${x}" y="149.5" text-anchor="middle" font-size="9" font-weight="700" fill="${C.B}">${hit ? 'admin' : 'guest'}</text>
        `).join('');

        return say(msg)
          + (hit ? chain(226, 66, 70, 86) + chain(226, 66, 170, 86) + chain(226, 66, 270, 86) : '')
          + flask(226, 44, r.k)
          + (r.k === 'x' ? ban(226, 44, 24) : '')
          + bat(300, 30, .9, m.bat)
          + cats;
      },

      code: [
        'const profile = { nickname: "Mimi" };',
        'function merge(target, input) {',
        '  for (const key in input) {',
        '    const value = input[key];',
        '    if (typeof value === "object") {',
        '      merge(target[key] ??= {}, value);',
        '    } else {',
        '      target[key] = value;',
        '    }',
        '  }',
        '  return target;',
        '}',
        'const requestBody = JSON.parse(rawBody);',
        'merge(profile, requestBody);',
        'const guest = {};',
        'if (guest.isAdmin) grantCrown();'
      ],
      hl: 2,
      why: 'this loop copies every key from the input, including __proto__ and constructor.',

      fix: [
        ['  for (const key of ["nickname", "theme"].filter(k => typeof input[k] === "string")) {', 1],
        ['  for (const key of Object.keys(input)) {', 0,
          'JSON.parse makes __proto__ a normal own key, so Object.keys still lists it.'],
        ['  for (const key of Object.keys(input).filter(k => k !== "__proto__")) {', 0,
          'constructor.prototype still gets through. Only an allowlist is safe.']
      ]
    });
  </script>
</body>
</html>
